<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { width: 340px; margin: 0; padding: 12px; font: 13px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; background: #1b2130; color: #dfe5f1; }
  h1 { font-size: 14px; margin: 0 0 8px; color: #7fd1ff; }
  .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #666; flex: 0 0 auto; }
  .dot.ok { background: #2bb673; box-shadow: 0 0 6px #2bb67388; }
  .dot.bad { background: #d9534f; box-shadow: 0 0 6px #d9534f88; }
  .muted { color: #8a94a8; font-size: 12px; }
  button { background: #4a6cf7; border: 0; color: #fff; border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  button:hover { background: #3a58d8; }
  button:disabled { background: #555f77; cursor: default; }
  hr { border: 0; border-top: 1px solid #333d52; margin: 10px 0; }
  #live { font-family: Consolas, monospace; font-size: 18px; color: #9f9; letter-spacing: .5px; }
  #live small { font-size: 11px; color: #8a94a8; }
  form { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  input { width: 76px; background: #10141d; color: #dfe5f1; border: 1px solid #3a4560; border-radius: 6px; padding: 6px 8px; font-family: Consolas, monospace; font-size: 14px; }
  input:focus { outline: 1px solid #4a6cf7; }
  #result { margin-top: 8px; font-size: 12.5px; min-height: 18px; white-space: pre-wrap; }
  #result.ok { color: #2bb673; }
  #result.err { color: #ff8a80; }
  .phys { font-family: Consolas, monospace; font-size: 11px; color: #66708a; }
</style>
</head>
<body>
  <h1>Mouse Bridge</h1>

  <div class="row"><span class="dot" id="dot-daemon"></span><span id="txt-daemon">守护进程：检查中…</span></div>
  <div class="row"><span class="dot" id="dot-ws"></span><span id="txt-ws">扩展连接：检查中…</span></div>
  <div class="row" id="row-wake" style="display:none">
    <button id="btn-wake">启动守护进程</button><span class="muted" id="wake-note"></span>
  </div>

  <hr>

  <div class="row">
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
      <input type="checkbox" id="ov-toggle" style="width:16px;height:16px;accent-color:#4a6cf7">
      <span>页面右下角实时坐标</span>
    </label>
  </div>
  <div class="row muted">开启后移动鼠标，页面右下角实时显示 <b>css(x,y) dev(x,y)</b>（当前页面坐标）。</div>

  <hr>

  <form id="moveform">
    <label>X <input type="number" step="any" id="mx" required></label>
    <label>Y <input type="number" step="any" id="my" required></label>
    <button type="submit" id="btn-move">移动</button>
  </form>
  <div class="row muted">输入的是当前页面的视口坐标（css 像素），不是桌面像素。</div>
  <div id="result"></div>

  <script src="popup.js"></script>
</body>
</html>
